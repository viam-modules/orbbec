name: Build

on:
  push:
    branches:
      - main
  pull_request:

# Same steps and build environments as publish.yml, so PRs exercise the release path.
jobs:
  build-module-windows:
    # pin instead of using windows-latest which was recently bumped to a version that breaks conan
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up build environment
        run: make setup

      - name: Build module
        run: make module.tar.gz

  build-module-nix:
    strategy:
      matrix:
        include:
          # macos-26 matches etc/conan/macos.profile.
          - os: macos-26
          # The cpp-sdk-conan images ship conan, the viamconan remote and the default profile
          # that viamconan's prebuilt Linux binaries are built with.
          - os: ubuntu-22.04
            container:
              image: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:jammy
          - os: ubuntu-22.04-arm
            container:
              image: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:jammy

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up build environment
        run: make setup

      - name: Build module
        run: make module.tar.gz
