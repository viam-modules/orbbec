name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-module-windows:
    # Pinned to windows-2022 (Visual Studio 2022). As of ~2026-06-28 the
    # windows-latest image became windows-2025-vs2026, which ships Visual Studio
    # 18 "2026"; Conan then picks the "Visual Studio 18 2026" CMake generator, and
    # abseil's build invokes a cmake that doesn't recognize it ("Could not create
    # named generator"), breaking the build. windows-2022 keeps VS 2022, so Conan
    # emits "Visual Studio 17 2022", which every cmake in the graph understands.
    # This is a stopgap until the abseil recipe / SDK dep graph supports VS 18.
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install deps
        run: choco install -y conan git

      - name: Set up python/conan
        shell: powershell
        # Powershell will not exit on error without the line below...highly vexing.
        # I would love to find out that there is a better way to do this.
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv

          conan profile detect

          conan remote add viamconan https://viam.jfrog.io/artifactory/api/conan/viamconan --index 0

        env:
          CONAN_USER_HOME: c:/cache
          CONAN_USER_HOME_SHORT: c:/cache/conan_shortpaths

      - name: Build package and module
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv

          conan create . -o:a "viam-cpp-sdk/*:shared=False" -s:a build_type=Release -s:a compiler.cppstd=17 --build=missing -cc core:non_interactive=True
        env:
          CONAN_USER_HOME: c:/cache
          CONAN_USER_HOME_SHORT: c:/cache/conan_shortpaths

  build-module-nix:
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-22.04
            container:
                image: ghcr.io/viamrobotics/rdk-devenv:amd64
                options: --platform linux/amd64
          - os: ubuntu-22.04-arm
            container:
              image: ghcr.io/viamrobotics/rdk-devenv:arm64
              options: --platform linux/arm64

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install deps (mac)
        if: matrix.os == 'macos-latest'
        run: brew install python@3.11

      - name: Install deps (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt update -y
          apt upgrade -y
          apt install -y cmake python3.11 python3.11-venv wget

      - name: Set up python/conan
        run: |
          python3 -m venv venv && . ./venv/bin/activate
          python3 -m pip install conan
          conan profile detect
          conan remote add viamconan https://viam.jfrog.io/artifactory/api/conan/viamconan --index 0

      - name: Build package and module
        run: |
          . ./venv/bin/activate
          conan create . -o:a "viam-cpp-sdk/*:shared=False" -s:a build_type=Release -s:a compiler.cppstd=17 --build=missing \
          -cc core:non_interactive=True
